name: CI

# Checks every pull request (including Dependabot's) before it can reach main.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx next build
        env:
          NEXT_PUBLIC_SITE_URL: https://irishgrid.com
