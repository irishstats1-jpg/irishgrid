name: Site check

# Manual check of how the live site answers crawlers. Results are reported as
# annotations (status, content type, size, first bytes) so they can be read
# through the API.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch as Googlebot and as a browser
        run: |
          for ua in "Googlebot/2.1 (+http://www.google.com/bot.html)" "Mozilla/5.0"; do
            for path in /sitemap.xml /robots.txt /; do
              out=$(curl -sS -o body.txt -w '%{http_code} | type=%{content_type} | bytes=%{size_download} | redirect=%{redirect_url}' -A "$ua" "https://irishgrid.com$path" 2>&1)
              hdr=$(curl -sS -o /dev/null -D - -A "$ua" "https://irishgrid.com$path" | tr -d '\r' | grep -iE '^(server|cf-mitigated|cache-control|x-robots-tag|content-encoding):' | tr '\n' ' ')
              start=$(head -c 120 body.txt | tr -d '\n\r' | tr '%' '_')
              echo "::notice title=${path} [${ua%% *}]::${out} | ${hdr} | start=${start}"
            done
          done
